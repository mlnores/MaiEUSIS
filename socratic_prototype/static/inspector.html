<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Socratic teammate | Researcher inspector</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="teammate.css"></head>
<body><main class="container"><div class="header"><div><h1>Evidence and intervention trace</h1><p class="muted">Researcher view · Participant-visible evidence · Provisional models</p></div><a href="/">Open decision tasks</a></div>
<section class="panel"><div class="trace-tools"><label>Recorded session<select id="sessionSelect"></select></label><button id="refresh">Refresh</button><button id="verify">Verify replay</button><button id="exportJson">Export trace JSON</button><button id="exportRdf">Export RDF</button></div><p id="sessionMeta" class="small muted"></p><p id="replayStatus" role="status"></p><p id="error" class="loss" role="alert"></p></section>
<div class="trace-layout"><aside class="panel trace-sidebar"><h2>Event history</h2><label>View<select id="eventFilter"><option value="all">All state updates</option><option value="evaluation">Intervention points</option><option value="feedback">Feedback updates</option></select></label><div class="actions" style="margin:12px 0"><button id="prev" aria-label="Previous event">←</button><button id="next" aria-label="Next event">→</button></div><div id="eventList"></div></aside><section class="panel trace-content" id="detail"><p>Select a session to inspect its evidence.</p></section></div></main><script src="inspector.js"></script></body></html>
